name: Native tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12
      - run: uv run --locked node tools/test_native.mjs
      - name: Installed skill and Unicode path smoke
        run: uv run --locked python tools/smoke_native_install.py
      - name: Cloud setup on Linux
        if: matrix.os == 'ubuntu-latest'
        run: bash tools/setup_cloud.sh
      - name: Verify native source tree
        run: uv run --locked python tools/audit_native_tree.py
      - run: uv run --locked python tools/build_native_distribution.py --output dist/native-pptd-review.zip
      - run: uv run --locked python tools/build_native_distribution.py --editor --output dist/native-editor-review.zip
      - run: npm run pack:check
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: |
            dist/*.zip
            docs/audit/native-tree.json
            docs/audit/platform-smoke.json
